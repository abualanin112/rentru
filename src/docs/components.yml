components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        isActive:
          type: boolean
        branchId:
          type: string
          format: uuid
        lastLoginAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
      example:
        id: '123e4567-e89b-12d3-a456-426614174000'
        email: 'john.doe@rentru.com'
        firstName: 'John'
        lastName: 'Doe'
        isActive: true
        branchId: 'branch-uuid'
        lastLoginAt: '2026-06-11T00:00:00.000Z'
        createdAt: '2026-06-11T00:00:00.000Z'
        updatedAt: '2026-06-11T00:00:00.000Z'
        deletedAt: null

    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        level:
          type: integer
        version:
          type: integer
        isSystem:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 'role-uuid'
        name: 'Branch Manager'
        description: 'Manager for a specific branch'
        level: 50
        version: 1
        isSystem: false
        createdAt: '2026-06-11T00:00:00.000Z'
        updatedAt: '2026-06-11T00:00:00.000Z'

    Permission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        subject:
          type: string
        scope:
          type: string
        group:
          type: string
      example:
        id: 'perm-uuid'
        action: 'read'
        subject: 'users'
        scope: 'branch'
        group: 'IAM'

    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        roleId:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, COMPLETED, REVOKED, EXPIRED]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 'inv-uuid'
        email: 'new.user@rentru.com'
        roleId: 'role-uuid'
        branchId: 'branch-uuid'
        status: 'PENDING'
        expiresAt: '2026-06-13T00:00:00.000Z'

    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        deviceId:
          type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      example:
        id: 'session-uuid'
        userId: 'user-uuid'
        deviceId: 'device-xyz-123'
        expiresAt: '2026-06-11T12:00:00.000Z'

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
        totalResults:
          type: integer
      example:
        page: 1
        limit: 10
        totalPages: 1
        totalResults: 5

    Error:
      type: object
      properties:
        code:
          type: number
        message:
          type: string

  responses:
    DuplicateEmail:
      description: Email already taken
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            message: Email already taken
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 401
            message: Please authenticate
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 403
            message: Forbidden
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            message: Not found
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 409
            message: Resource conflict

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
